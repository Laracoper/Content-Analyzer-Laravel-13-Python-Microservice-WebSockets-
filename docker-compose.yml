services:
  # Веб-сервер (Единая точка входа)
  nginx:
    image: nginx:alpine
    container_name: ca-nginx
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./laravel-app:/var/www/laravel-app
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel-app
      - python-service
      - phpmyadmin

  # Фронтенд и API-Гейтвей (Laravel 13)
  laravel-app:
    build:
      context: ./laravel-app
      dockerfile: Dockerfile
    container_name: ca-laravel
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /var/www/laravel-app
    volumes:
      - ./laravel-app:/var/www/laravel-app
    depends_on:
      - mysql
      - redis

  # База данных MySQL
  mysql:
    image: mysql:8.0
    container_name: ca-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ca_database
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - ca-mysql-data:/var/lib/mysql

  # phpMyAdmin для контроля MySQL
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ca-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root_password
      # 🔥 ДОБАВЬТЕ ЭТУ СТРОКУ (Обязательно с косой чертой на конце):
      PMA_ABSOLUTE_URI: http://localhost:8083/phpmyadmin/ 
    depends_on:
      - mysql

  # Redis (Вместо database для очередей и кэша)
  redis:
    image: redis:alpine
    container_name: ca-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Python Микросервис (REST API часть)
  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: ca-python-api
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./python-service:/app
    depends_on:
      - redis
      - mysql

  # Python Микросервис (Фоновый воркер очередей)
  python-worker:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: ca-python-worker
    restart: unless-stopped
    command: python worker.py
    volumes:
      - ./python-service:/app
    depends_on:
      - redis
      - mysql
  vite:
    image: node:20-alpine
    container_name: ca-vite
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5174:5174"
    volumes:
      - ./laravel-app:/app
    command: npm run dev -- --host 0.0.0.0 --port 5174
    # Фоновый мост между Redis и веб-сокетами Reverb
  laravel-listener:
    build:
      context: ./laravel-app
      dockerfile: Dockerfile
    container_name: ca-laravel-listener
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /var/www/laravel-app
    command: php artisan python:listen
    environment:
      - REDIS_HOST=redis
      - REVERB_HOST=laravel-reverb
    volumes:
      - ./laravel-app:/var/www/laravel-app
    depends_on:
      - redis
      - laravel-app
      - laravel-reverb
    # Автозапуск сервера веб-сокетов Reverb
  laravel-reverb:
    build:
      context: ./laravel-app
      dockerfile: Dockerfile
    container_name: ca-laravel-reverb
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /var/www/laravel-app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8090:8080" # Пробрасываем сокеты наружу в Windows
    volumes:
      - ./laravel-app:/var/www/laravel-app
    depends_on:
      - redis
      - laravel-app



volumes:
  ca-mysql-data:
    driver: local
