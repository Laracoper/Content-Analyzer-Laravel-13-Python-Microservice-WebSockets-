server {
    listen 80;
    server_name localhost;
    root /var/www/laravel-app/public;
    index index.php index.html;

    charset utf-8;

    # 1. Запросы к Python-микросервису (REST API)
    location /api/v1/ {
        proxy_pass http://python-service:8000; # Имя сервиса из docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

   
        # 2. Доступ к phpMyAdmin и его внутренним PHP-скриптам
    location ^~ /phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /phpmyadmin;

        # Переопределяем буферы, чтобы тяжелые JS-скрипты phpMyAdmin не обрывались
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }



    # 3. Основной фронтенд Laravel и Livewire Volt
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Обработка PHP файлов через PHP-FPM
    location ~ \.php$ {
        fastcgi_pass laravel-app:9000; # Имя сервиса из docker-compose
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
